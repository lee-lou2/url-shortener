<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL redirect flow · url-shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · GET /{short_key}</p>
    <h1>URL redirect flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="url-redirect-flow-dark-title url-redirect-flow-dark-desc">
        <title id="url-redirect-flow-dark-title">URL redirect flow</title>
        <desc id="url-redirect-flow-dark-desc">Sequence diagram showing GET /{short_key} parsing the short key before I/O, checking in-process moka L1 with singleflight PostgreSQL PK fallback on miss, returning a 302 Location or pre-rendered Askama HTML response, and firing an optional SSRF-safe async webhook.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
          </marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <!-- Lifelines: Client 136 · Axum+moka 368 · PostgreSQL 600 · Webhook 832 -->
        <line x1="136" y1="96" x2="136" y2="548" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="368" y1="96" x2="368" y2="548" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="600" y1="96" x2="600" y2="548" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="832" y1="96" x2="832" y2="548" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="364" y="132" width="8" height="392" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="596" y="336" width="8" height="44" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- Incoming request + parse before I/O -->
        <line x1="140" y1="132" x2="364" y2="132" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="220" y="112" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="254" y="121" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET /{KEY}</text>
        <path d="M 372,152 H 412 Q 420,152 420,160 V 172 Q 420,180 412,180 H 372" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="432" y="160" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="476" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARSE KEY + L1</text>

        <!-- ALT Combined Fragment (Axum+moka · PostgreSQL) -->
        <rect x="304" y="200" width="368" height="248" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <rect x="304" y="200" width="40" height="16" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="324" y="212" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Region 1: L1 hit -->
        <text x="384" y="222" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[L1 hit · Found 60s / Miss 15s]</text>
        <path d="M 372,240 H 412 Q 420,240 420,248 V 260 Q 420,268 412,268 H 372" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="432" y="248" width="104" height="12" rx="2" fill="#2d3142"/>
        <text x="484" y="257" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY RANDOM_KEY</text>

        <!-- ALT divider -->
        <line x1="312" y1="288" x2="664" y2="288" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Region 2: L1 miss -> singleflight PK lookup -->
        <text x="384" y="308" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[else · singleflight DB load]</text>
        <line x1="372" y1="336" x2="596" y2="336" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="436" y="316" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="484" y="325" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SELECT BY PK ID</text>
        <line x1="596" y1="380" x2="372" y2="380" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="452" y="360" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="486" y="369" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ACTIVE ROW</text>
        <path d="M 372,400 H 412 Q 420,400 420,408 V 420 Q 420,428 412,428 H 372" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="432" y="408" width="104" height="12" rx="2" fill="#2d3142"/>
        <text x="484" y="417" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMPILE + FILL L1</text>

        <!-- Response + async webhook -->
        <line x1="364" y1="484" x2="140" y2="484" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="204" y="464" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="252" y="473" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">302 OR 200 HTML</text>
        <line x1="372" y1="524" x2="828" y2="524" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="672" y="504" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="716" y="513" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IF HOOK · POST</text>

        <!-- Actor boxes -->
        <rect x="64" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="64" y="40" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <rect x="72" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(148,158,178,0.45)" stroke-width="0.8"/>
        <text x="86" y="55" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="136" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text>
        <text x="136" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Browser · Mobile</text>
        <rect x="296" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="296" y="40" width="144" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <rect x="304" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="318" y="55" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
        <text x="368" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Axum + moka</text>
        <text x="368" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parse + singleflight</text>
        <rect x="528" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="528" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="536" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
        <text x="550" y="55" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="600" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="600" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">urls · urls_pkey</text>
        <rect x="760" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="760" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="768" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,158,178,0.45)" stroke-width="0.8"/>
        <text x="784" y="55" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="832" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Webhook</text>
        <text x="832" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SafeDNS · max 64</text>

        <!-- Legend strip -->
        <line x1="40" y1="568" x2="920" y2="568" stroke="rgba(245,245,245,0.14)" stroke-width="0.8"/>
        <text x="40" y="584" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="600" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="608" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal L1 + API</text>
        <rect x="164" y="596" width="28" height="18" rx="2" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="178" y="608" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ALT</text>
        <text x="200" y="608" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">L1 branch</text>
        <line x1="292" y1="604" x2="320" y2="604" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="328" y="608" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP request</text>
        <line x1="432" y1="604" x2="460" y2="604" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="468" y="608" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return</text>
        <line x1="544" y1="604" x2="572" y2="604" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="580" y="608" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Fire-and-forget</text>
        <line x1="704" y1="604" x2="732" y2="604" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="740" y="608" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Fast path / response</text>
      </svg>
    </div>
  </div>
</body>
</html>
