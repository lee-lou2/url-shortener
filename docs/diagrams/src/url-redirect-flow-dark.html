<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL redirect flow · url-shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · GET /{short_key}</p>
    <h1>URL redirect flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="url-redirect-flow-dark-title url-redirect-flow-dark-desc">
        <title id="url-redirect-flow-dark-title">URL redirect flow</title>
        <desc id="url-redirect-flow-dark-desc">Sequence diagram showing GET /{short_key} parsing the short key before I/O, checking in-process moka L1 and optional Redis u:{id} L2 with singleflight PostgreSQL fallback, compiling a 302 Location or pre-rendered Askama HTML response, and firing an optional SSRF-safe async webhook.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
          </marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <!-- Lifelines: Client 108 · Axum+L1 296 · Redis L2 484 · PostgreSQL 672 · Webhook 852 -->
        <line x1="108" y1="96" x2="108" y2="588" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="296" y1="96" x2="296" y2="588" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="484" y1="96" x2="484" y2="588" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="672" y1="96" x2="672" y2="588" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="852" y1="96" x2="852" y2="588" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="292" y="132" width="8" height="432" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="480" y="250" width="8" height="32" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="668" y="348" width="8" height="40" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="480" y="456" width="8" height="20" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- Incoming request + parse before I/O -->
        <line x1="112" y1="132" x2="292" y2="132" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="168" y="112" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="202" y="121" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET /{KEY}</text>
        <path d="M 300,152 H 336 Q 344,152 344,160 V 172 Q 344,180 336,180 H 300" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="356" y="160" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="400" y="169" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARSE KEY + L1</text>

        <!-- ALT Combined Fragment (Axum+L1 · Redis L2 · PostgreSQL) -->
        <rect x="240" y="200" width="472" height="288" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <rect x="240" y="200" width="40" height="16" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="260" y="212" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Region 1: L1 miss -> L2 hit -->
        <text x="312" y="220" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[L1 miss · optional L2 hit]</text>
        <line x1="300" y1="250" x2="480" y2="250" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="356" y="232" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="390" y="241" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET U:{ID}</text>
        <line x1="480" y1="282" x2="300" y2="282" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="356" y="264" width="72" height="12" rx="2" fill="#2d3142"/>
        <text x="392" y="273" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JSON RECORD</text>

        <!-- ALT divider -->
        <line x1="248" y1="300" x2="704" y2="300" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Region 2: L2 miss or CB open -> DB singleflight -->
        <text x="312" y="320" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[else · singleflight DB load]</text>
        <line x1="300" y1="348" x2="668" y2="348" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="540" y="328" width="80" height="12" rx="2" fill="#2d3142"/>
        <text x="580" y="337" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SELECT BY ID</text>
        <line x1="668" y1="388" x2="300" y2="388" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="544" y="368" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="578" y="377" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ACTIVE ROW</text>
        <path d="M 300,408 H 336 Q 344,408 344,416 V 428 Q 344,436 336,436 H 300" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="356" y="416" width="100" height="12" rx="2" fill="#2d3142"/>
        <text x="406" y="425" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMPILE + VERIFY</text>
        <line x1="300" y1="468" x2="480" y2="468" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
        <rect x="344" y="448" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="392" y="457" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ASYNC SETEX 60S</text>

        <!-- Response + async webhook -->
        <line x1="292" y1="524" x2="112" y2="524" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="156" y="504" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="204" y="513" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">302 OR 200 HTML</text>
        <line x1="300" y1="564" x2="848" y2="564" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <rect x="720" y="544" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="764" y="553" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IF HOOK · POST</text>

        <!-- Actor boxes (drawn after arrows) -->
        <rect x="44" y="40" width="128" height="56" rx="6" fill="#2d3142"/>
        <rect x="44" y="40" width="128" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <rect x="52" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(148,158,178,0.45)" stroke-width="0.8"/>
        <text x="66" y="55" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="108" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text>
        <text x="108" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Browser · Mobile</text>
        <rect x="232" y="40" width="128" height="56" rx="6" fill="#2d3142"/>
        <rect x="232" y="40" width="128" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <rect x="240" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="254" y="55" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
        <text x="296" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Axum + moka</text>
        <text x="296" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parse + singleflight</text>
        <rect x="420" y="40" width="128" height="56" rx="6" fill="#2d3142"/>
        <rect x="420" y="40" width="128" height="56" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="428" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(148,158,178,0.45)" stroke-width="0.8"/>
        <text x="442" y="55" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
        <text x="484" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Redis (Opt)</text>
        <text x="484" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">u:{id} · 150ms CB</text>
        <rect x="608" y="40" width="128" height="56" rx="6" fill="#2d3142"/>
        <rect x="608" y="40" width="128" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="616" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
        <text x="630" y="55" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="672" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="672" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">urls · PK lookup</text>
        <rect x="788" y="40" width="128" height="56" rx="6" fill="#2d3142"/>
        <rect x="788" y="40" width="128" height="56" rx="6" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="796" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(148,158,178,0.45)" stroke-width="0.8"/>
        <text x="812" y="55" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="852" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Webhook</text>
        <text x="852" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SafeDNS · max 64</text>

        <!-- Legend strip -->
        <line x1="40" y1="608" x2="920" y2="608" stroke="rgba(245,245,245,0.14)" stroke-width="0.8"/>
        <text x="40" y="624" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="640" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="648" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal L1 + API</text>
        <rect x="164" y="636" width="28" height="18" rx="2" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="178" y="648" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ALT</text>
        <text x="200" y="648" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Miss branch</text>
        <line x1="308" y1="644" x2="336" y2="644" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="344" y="648" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP request</text>
        <line x1="448" y1="644" x2="476" y2="644" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="484" y="648" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return</text>
        <line x1="560" y1="644" x2="588" y2="644" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="596" y="648" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Fire-and-forget</text>
        <line x1="720" y1="644" x2="748" y2="644" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="756" y="648" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">302 / 200 response</text>
      </svg>
    </div>
  </div>
</body>
</html>
