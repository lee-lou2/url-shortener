<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform-specific redirect · url-shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · views/redirect.html</p>
    <h1>Platform-specific redirect</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-redirect-title platform-redirect-desc">
        <title id="platform-redirect-title">Platform-specific redirect</title>
        <desc id="platform-redirect-desc">Flowchart showing client-side iOS, iPadOS, and Android detection in views/redirect.html branching between default web fallback, safe deep link launch with a 1500ms timer cancelled on visibilitychange/pagehide/blur, and location.replace platform fallback.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- Arrows -->
        <line x1="280" y1="84" x2="280" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="384" y1="160" x2="584" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="204" x2="280" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 384,288 H 676 Q 684,288 684,296 V 468" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="332" x2="280" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="416" x2="280" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="536" x2="280" y2="572" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="384" y1="492" x2="584" y2="492" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="684" y1="516" x2="684" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="444" y="140" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="149" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO · DESKTOP</text>
        <rect x="292" y="218" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="227" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES · MOBILE</text>
        <rect x="508" y="268" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="292" y="344" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="353" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="292" y="548" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="334" y="557" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HIDDEN / BLUR</text>
        <rect x="444" y="472" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="481" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TIMEOUT 1.5S</text>

        <!-- Editorial callout -->
        <text x="920" y="60" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Plain links use 302 · HTML runs only for OG or deep links</text>
        <path d="M 792,68 Q 740,84 684,136" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="684" cy="136" r="2" fill="#2d3142"/>

        <!-- Start oval -->
        <rect x="180" y="36" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="180" y="36" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="280" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HTML Loaded</text>
        <text x="280" y="73" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data-* · hash CSP</text>

        <!-- Diamond 1 -->
        <polygon points="280,116 384,160 280,204 176,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="157" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">iOS / iPadOS</text>
        <text x="280" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">or Android?</text>

        <!-- End oval: Default Fallback -->
        <rect x="584" y="136" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="584" y="136" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="684" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Default Fallback</text>
        <text x="684" y="173" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">location.replace()</text>

        <!-- Diamond 2 -->
        <polygon points="280,244 384,288 280,332 176,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="285" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Safe deep link</text>
        <text x="280" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">configured?</text>

        <!-- Step: Launch Deep Link -->
        <rect x="180" y="368" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="368" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Launch Deep Link</text>
        <text x="280" y="405" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">app link + 1.5s timer</text>

        <!-- Diamond 3 -->
        <polygon points="280,448 384,492 280,536 176,492" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="489" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">App handles URI</text>
        <text x="280" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">within 1500ms?</text>

        <!-- Step: Platform Fallback -->
        <rect x="584" y="468" width="200" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="468" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="684" y="490" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Platform Fallback</text>
        <text x="684" y="505" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">os_fallback || default</text>

        <!-- End oval: Native App -->
        <rect x="180" y="572" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="180" y="572" width="200" height="48" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="280" y="594" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Native App Opens</text>
        <text x="280" y="609" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">fallback timer cancelled</text>

        <!-- End oval: Web Redirect -->
        <rect x="584" y="572" width="200" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="584" y="572" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="684" y="594" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Web / Store Redirect</text>
        <text x="684" y="609" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">location.replace()</text>

        <!-- Legend strip -->
        <line x1="40" y1="640" x2="920" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
        <rect x="40" y="672" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Start / end (oval)</text>
        <rect x="212" y="672" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step (rectangle)</text>
        <polygon points="392,678 404,672 416,678 404,684" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="424" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Decision (diamond)</text>
        <line x1="572" y1="678" x2="600" y2="678" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="608" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Deep link hit</text>
        <line x1="724" y1="678" x2="752" y2="678" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="760" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Timeout fallback</text>
      </svg>
    </div>
  </div>
</body>
</html>
