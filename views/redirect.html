<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>{% if let Some(value) = og_title %}{{ value }}{% endif %}</title>
    <meta name="description" content="{% if let Some(value) = og_description %}{{ value }}{% endif %}">
    <meta name="image" content="{% if let Some(value) = og_image_url %}{{ value }}{% endif %}">

    <!-- Open Graph -->
    <meta property="og:title" content="{% if let Some(value) = og_title %}{{ value }}{% endif %}">
    <meta property="og:description" content="{% if let Some(value) = og_description %}{{ value }}{% endif %}">
    <meta property="og:image" content="{% if let Some(value) = og_image_url %}{{ value }}{% endif %}">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if let Some(value) = og_title %}{{ value }}{% endif %}">
    <meta name="twitter:description" content="{% if let Some(value) = og_description %}{{ value }}{% endif %}">
    <meta name="twitter:image" content="{% if let Some(value) = og_image_url %}{{ value }}{% endif %}">

    <!-- Schema.org -->
    <meta itemprop="name" content="{% if let Some(value) = og_title %}{{ value }}{% endif %}">
    <meta itemprop="description" content="{% if let Some(value) = og_description %}{{ value }}{% endif %}">
    <meta itemprop="image" content="{% if let Some(value) = og_image_url %}{{ value }}{% endif %}">

    <!-- Apple/iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{% if let Some(value) = og_title %}{{ value }}{% endif %}">

    <!-- Microsoft -->
    <meta name="msapplication-TileImage" content="{% if let Some(value) = og_image_url %}{{ value }}{% endif %}">
</head>

<body id="redirect-data"
      data-default-fallback="{{ default_url }}"
      data-ios-deeplink="{% if let Some(value) = ios_deep_link %}{{ value }}{% endif %}"
      data-ios-fallback="{% if let Some(value) = ios_fallback_url %}{{ value }}{% endif %}"
      data-android-deeplink="{% if let Some(value) = android_deep_link %}{{ value }}{% endif %}"
      data-android-fallback="{% if let Some(value) = android_fallback_url %}{{ value }}{% endif %}">
    <script>
        window.onload = function () {
            var body = document.getElementById('redirect-data');
            var default_fallback_url = body.getAttribute('data-default-fallback') || '';
            var deeplink_ios = body.getAttribute('data-ios-deeplink') || '';
            var fallback_url_ios = body.getAttribute('data-ios-fallback') || default_fallback_url;
            var deeplink_android = body.getAttribute('data-android-deeplink') || '';
            var fallback_url_android = body.getAttribute('data-android-fallback') || default_fallback_url;

            function isAndroid() {
                return /Android/i.test(navigator.userAgent);
            }

            function isiOS() {
                return /iPhone|iPad|iPod/i.test(navigator.userAgent);
            }

            if (isAndroid()) {
                if (deeplink_android) {
                    // Attempt Android deeplink
                    window.location.href = deeplink_android;
                    setTimeout(function () {
                        // If the app is not installed, redirect to fallback URL
                        window.location.href = fallback_url_android;
                    }, 2000);
                } else {
                    // If no Android deeplink, redirect directly to fallback URL
                    window.location.href = fallback_url_android;
                }
            } else if (isiOS()) {
                if (deeplink_ios) {
                    // Attempt iOS deeplink
                    window.location.href = deeplink_ios;
                    setTimeout(function () {
                        // If the app is not installed, redirect to fallback URL
                        window.location.href = fallback_url_ios;
                    }, 2000);
                } else {
                    // If no iOS deeplink, redirect directly to fallback URL
                    window.location.href = fallback_url_ios;
                }
            } else {
                // If not iOS or Android, redirect to the default fallback URL
                window.location.href = default_fallback_url;
            }
        }
    </script>
</body>

</html>
