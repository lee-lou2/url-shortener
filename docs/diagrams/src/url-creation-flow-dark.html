<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL creation flow · url-shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · POST /v1/urls</p>
    <h1>URL creation flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="url-creation-flow-dark-title url-creation-flow-dark-desc">
        <title id="url-creation-flow-dark-title">URL creation flow</title>
        <desc id="url-creation-flow-dark-desc">Sequence diagram showing POST /v1/urls authenticating via JWT, validating and computing an xxh3_128 hash, and running a race-safe INSERT ON CONFLICT to return either a newly created or existing Base62 short key.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <!-- Lifelines: Client 136 · JWT Auth 368 · Axum API 600 · PostgreSQL 832 -->
        <line x1="136" y1="96" x2="136" y2="580" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="368" y1="96" x2="368" y2="580" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="600" y1="96" x2="600" y2="580" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="832" y1="96" x2="832" y2="580" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="364" y="132" width="8" height="44" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="596" y="176" width="8" height="384" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="828" y="280" width="8" height="88" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>
        <rect x="828" y="480" width="8" height="36" fill="rgba(245,245,245,0.08)" stroke="#bfc0c0" stroke-width="0.8"/>

        <!-- Pre-branch messages -->
        <line x1="140" y1="132" x2="364" y2="132" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="212" y="112" width="84" height="12" rx="2" fill="#2d3142"/>
        <text x="254" y="121" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /V1/URLS</text>
        <line x1="372" y1="176" x2="596" y2="176" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="452" y="156" width="68" height="12" rx="2" fill="#2d3142"/>
        <text x="486" y="165" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JWT CLAIMS</text>
        <path d="M 604,212 H 644 Q 652,212 652,220 V 236 Q 652,244 644,244 H 604" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="664" y="222" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="712" y="231" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATE + XXH3</text>
        <line x1="604" y1="280" x2="828" y2="280" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="668" y="260" width="96" height="12" rx="2" fill="#2d3142"/>
        <text x="716" y="269" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INSERT CONFLICT</text>

        <!-- ALT Combined Fragment -->
        <rect x="84" y="308" width="792" height="260" rx="4" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <rect x="84" y="308" width="40" height="16" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="104" y="320" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <!-- Region 1: New URL inserted -->
        <text x="152" y="340" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[new url · row inserted]</text>
        <line x1="828" y1="368" x2="604" y2="368" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="676" y="348" width="84" height="12" rx="2" fill="#2d3142"/>
        <text x="718" y="357" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ID + RAND_KEY</text>
        <line x1="596" y1="408" x2="144" y2="408" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="444" y="388" width="84" height="12" rx="2" fill="#2d3142"/>
        <text x="486" y="397" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 · CREATED</text>

        <!-- ALT divider -->
        <line x1="92" y1="432" x2="868" y2="432" stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Region 2: Duplicate hash -->
        <text x="152" y="452" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[else · duplicate hash]</text>
        <line x1="604" y1="480" x2="828" y2="480" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="672" y="460" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="716" y="469" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SELECT BY HASH</text>
        <line x1="828" y1="516" x2="604" y2="516" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="676" y="496" width="80" height="12" rx="2" fill="#2d3142"/>
        <text x="716" y="505" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXISTING ROW</text>
        <line x1="596" y1="552" x2="144" y2="552" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="440" y="532" width="88" height="12" rx="2" fill="#2d3142"/>
        <text x="484" y="541" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 · EXISTING</text>

        <!-- Actor boxes (drawn after arrows) -->
        <rect x="64" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="64" y="40" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/>
        <rect x="72" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(148,158,178,0.45)" stroke-width="0.8"/>
        <text x="86" y="55" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="136" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text>
        <text x="136" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Browser · API</text>
        <rect x="296" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="296" y="40" width="144" height="56" rx="6" fill="rgba(240,138,89,0.06)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="304" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="320" y="55" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="368" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JWT Auth</text>
        <text x="368" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Bearer · cookie</text>
        <rect x="528" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="528" y="40" width="144" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <rect x="536" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="550" y="55" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="600" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Axum Handler</text>
        <text x="600" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">merge_short_key</text>
        <rect x="760" y="40" width="144" height="56" rx="6" fill="#2d3142"/>
        <rect x="760" y="40" width="144" height="56" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="768" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.45)" stroke-width="0.8"/>
        <text x="782" y="55" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="832" y="72" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
        <text x="832" y="87" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">urls · unique hash</text>

        <!-- Legend strip -->
        <line x1="40" y1="600" x2="920" y2="600" stroke="rgba(245,245,245,0.14)" stroke-width="0.8"/>
        <text x="40" y="616" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="632" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
        <text x="60" y="640" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal / created</text>
        <rect x="180" y="628" width="28" height="18" rx="2" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
        <text x="194" y="640" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ALT</text>
        <text x="216" y="640" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Branch fragment</text>
        <line x1="336" y1="636" x2="364" y2="636" stroke="#739fdf" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="372" y="640" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP call</text>
        <line x1="464" y1="636" x2="492" y2="636" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="500" y="640" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Internal call</text>
        <line x1="604" y1="636" x2="632" y2="636" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="640" y="640" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return</text>
        <line x1="720" y1="636" x2="748" y2="636" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="756" y="640" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Headline success</text>
      </svg>
    </div>
  </div>
</body>
</html>
